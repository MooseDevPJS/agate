[package]
name = "blocco"
version = "0.1.1"
edition = "2021"
description = "A light Minecraft launcher"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json", "stream", "gzip", "multipart"] }
futures = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha1 = "0.10"
md-5 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
dirs = "5"
regex = "1"
anyhow = "1"
open = "5"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
